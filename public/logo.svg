<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="edithShieldBg" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="edithShieldBorder" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="edithGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Glow & Shield Body -->
  <path
    d="M32 6 L52 14 C52 34 43 50 32 58 C21 50 12 34 12 14 Z"
    fill="url(#edithShieldBg)"
    stroke="url(#edithShieldBorder)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#edithGlow)"
  />

  <!-- Subtle Inner Guide -->
  <path
    d="M32 10.5 L48 17 C48 33 40.5 46.5 32 53.5 C23.5 46.5 16 33 16 17 Z"
    stroke="#34d399"
    stroke-opacity="0.25"
    stroke-width="1.5"
    fill="none"
  />

  <!-- Checkmark -->
  <path
    d="M23 31.5 L29 37.5 L41 24.5"
    stroke="#34d399"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

